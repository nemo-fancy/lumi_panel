name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  # Once CGO is linked in, cross-compilation and static linking are both gone,
  # and with them the single-binary promise. This is set globally so it cannot
  # be forgotten in one job.
  CGO_ENABLED: "0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: test
        run: go test ./...

      # The ladder is shared mutable state behind a mutex and the event bus
      # dispatches under a read lock. Both are exactly the shapes where a
      # refactor introduces a race that normal test runs never surface.
      - name: test -race
        run: go test -race ./...

      - name: build
        run: go build -ldflags "-X main.version=${GITHUB_SHA::12}" ./cmd/lumipanel

      # Proves the single-binary claim on every commit rather than at release
      # time, when a CGO dependency has already been merged.
      - name: cross-compile
        run: |
          for target in linux/amd64 linux/arm64 darwin/arm64 windows/amd64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null ./cmd/lumipanel
          done

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
